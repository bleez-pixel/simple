<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — My Bot</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #2a2a2a;
      --accent: #4ade80;
      --text: #e0e0e0;
      --text-muted: #666;
      --error: #f87171;
      --font-mono: 'Space Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      color: var(--text);
      background-image:
        linear-gradient(rgba(74, 222, 128, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 222, 128, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      margin: 1rem;
      animation: slideUp 0.4s ease forwards;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    h1 {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.875rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }

    .message.error {
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
      display: block;
    }

    .message.success {
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      display: block;
    }

    .footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="logo">My Bot System</div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in, your bot is waiting for you.</p>

    <div class="message" id="msgBox"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="alex@example.com" />
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="passInput" placeholder="Your password" />
    </div>

    <button class="btn" id="loginBtn" onclick="handleLogin()">
      LOGIN →
    </button>

    <div class="footer-text">
      New here? <a href="signup.html">Create an account</a>
    </div>
  </div>

  <script>
    // ============================================================
    // SUPABASE SETUP — Use the same URL and Key as signup.html
    // ============================================================
    const SUPABASE_URL = 'https://xvqiwsvvvbcevcelxgtf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWl3c3Z2dmJjZXZjZWx4Z3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNTQzNTcsImV4cCI6MjA5NDgzMDM1N30.PCMNOeF3u6IMOg1l26vfViHACRyhPeCHndyZLdhcPTA';

    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // CHECK ON PAGE LOAD — If already logged in, redirect directly
    // to index.html, no need to log in again.
    // ============================================================
    window.addEventListener('load', async () => {
      const { data } = await sb.auth.getSession();
      if (data.session) {
        // Already logged in — redirect to home page
        window.location.href = 'index.html';
      }
    });

    function showMsg(text, type) {
      const box = document.getElementById('msgBox');
      box.className = `message ${type}`;
      box.textContent = text;
    }

    // ============================================================
    // MAIN LOGIN FUNCTION
    // ============================================================
    async function handleLogin() {
      const email = document.getElementById('emailInput').value.trim();
      const pass = document.getElementById('passInput').value;
      const btn = document.getElementById('loginBtn');

      if (!email || !pass) {
        showMsg('Please fill in both email and password.', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Logging in...';

      try {
        // STEP 1: Log in with Supabase
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });

        if (error) throw error;

        // STEP 2: Get JWT Token and save it in localStorage
        // This token is sent to Botpress so it can identify the user
        const token = data.session.access_token;
        localStorage.setItem('sb_token', token);

        // STEP 3: Save user's plan in localStorage
        // Used in index.html to control plans and display details
        const { data: userData } = await sb
          .from('users')
          .select('name, plan, status, addon_messages')
          .eq('id', data.user.id)
          .single();

        // Save user info
        localStorage.setItem('sb_user', JSON.stringify(userData));

        // STEP 4: Redirect to home page
        showMsg('Logged in successfull! Redirecting to home page...', 'success');
        setTimeout(() => window.location.href = 'index.html', 1000);

      } catch (err) {
        showMsg(err.message || 'Incorrect email or password.', 'error');
        btn.disabled = false;
        btn.textContent = 'LOGIN →';
      }
    }
  </script>

</body>

</html>
