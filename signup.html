<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up — My Bot</title>

  <!-- Google Fonts: Distinctive pairing -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <!-- Supabase SDK — Loaded from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* ===== CSS Variables — Color theme of the website ===== */
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #2a2a2a;
      --accent: #4ade80;       /* green — Matches the bot's online status color */
      --accent-dim: #166534;
      --text: #e0e0e0;
      --text-muted: #666;
      --error: #f87171;
      --font-mono: 'Space Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      color: var(--text);
      /* Subtle grid pattern in background */
      background-image: 
        linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ===== Main Card ===== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      margin: 1rem;
      /* Entry animation */
      animation: slideUp 0.4s ease forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Header ===== */
    .logo {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    /* ===== Form Fields ===== */
    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    /* Green border on focus */
    input:focus {
      border-color: var(--accent);
    }

    /* ===== Submit Button ===== */
    .btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 0.875rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }

    /* Loading state */
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ===== Error / Success Messages ===== */
    .message {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none; /* Default hidden — shown via JS */
    }

    .message.error {
      background: rgba(248,113,113,0.1);
      border: 1px solid var(--error);
      color: var(--error);
      display: block;
    }

    .message.success {
      background: rgba(74,222,128,0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      display: block;
    }

    /* ===== Footer Link ===== */
    .footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logo / Brand -->
    <div class="logo">My Bot System</div>

    <h1>Create Account</h1>
    <p class="subtitle">Sign up now to start chatting with the bot.</p>

    <!-- Error/Success message box — Shown/Hidden via JS -->
    <div class="message" id="msgBox"></div>

    <!-- ===== Signup Form ===== -->
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="nameInput" placeholder="Alex Hassan" />
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="emailInput" placeholder="alex@example.com" />
    </div>

    <div class="field">
      <label>Password</label>
      <input type="password" id="passInput" placeholder="Min 6 characters" />
    </div>

    <button class="btn" id="signupBtn" onclick="handleSignup()">
      CREATE ACCOUNT →
    </button>

    <div class="footer-text">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script>
    // ============================================================
    // SUPABASE SETUP
    // Enter your Project URL and Anon Key here
    // Can be found in Supabase Dashboard → Settings → API
    // ============================================================
    const SUPABASE_URL = 'https://xvqiwsvvvbcevcelxgtf.supabase.co';       // ← Replace this
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWl3c3Z2dmJjZXZjZWx4Z3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNTQzNTcsImV4cCI6MjA5NDgzMDM1N30.PCMNOeF3u6IMOg1l26vfViHACRyhPeCHndyZLdhcPTA'; // ← Replace this

    // Create Supabase client — we will make all calls using this
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // FUNCTION TO DISPLAY MESSAGES
    // type = 'error' or 'success'
    // ============================================================
    function showMsg(text, type) {
      const box = document.getElementById('msgBox');
      box.className = `message ${type}`; // Set CSS class
      box.textContent = text;
    }

    // ============================================================
    // MAIN SIGNUP FUNCTION — Triggered on button click
    // ============================================================
    async function handleSignup() {
      const name  = document.getElementById('nameInput').value.trim();
      const email = document.getElementById('emailInput').value.trim();
      const pass  = document.getElementById('passInput').value;
      const btn   = document.getElementById('signupBtn');

      // --- Validation: Check for empty fields ---
      if (!name || !email || !pass) {
        showMsg('Please fill in all fields.', 'error');
        return;
      }

      if (pass.length < 6) {
        showMsg('Password must be at least 6 characters long.', 'error');
        return;
      }

      // --- Loading state: Disable the button ---
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        // STEP 1: Register user in Supabase Auth
        // Saves the email and password in Supabase's authentication system
        const { data, error } = await sb.auth.signUp({ email, password: pass });

        if (error) throw error; // If an error occurs, go to catch block

        // Safety Check: If email confirmation/enumeration protection is active and user exists, 
        // Supabase returns a success response with a null user.
        if (!data || !data.user) {
          throw new Error('This email might already be registered. Please try logging in or use a different email.');
        }

        // STEP 2: Save extra info in users table
        // auth.signUp only saves email/password
        // Name, plan, and status are inserted manually
        const { error: dbError } = await sb.from('users').insert({
          id: data.user.id,            // Use the same ID from Supabase Auth
          email: email,
          name: name,
          plan: 'free',                // Default plan — free
          status: 'active',            // Default status — active
          registered_at: new Date().toISOString() // Current date — for trial duration tracking
        });

        if (dbError) throw dbError;

        // STEP 3: Success! Redirect to login page
        showMsg('Account created successfully! Redirecting to login page...', 'success');
        setTimeout(() => window.location.href = 'login.html', 1500);

      } catch (err) {
        // Display any errors to the user
        showMsg(err.message || 'Something went wrong, please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'CREATE ACCOUNT →';
      }
    }
  </script>

</body>
</html>
